<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanvo Portfolio Video Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* Moving Tech Grid Background */
        .grid-background {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: panGrid 15s linear infinite;
            z-index: 1;
        }
        @keyframes panGrid {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-60px, -60px); }
        }

        /* Master 10-Second Video Container */
        .video-stage {
            position: relative;
            width: 1280px;
            height: 720px;
            background: #0b0f19;
            overflow: hidden;
            z-index: 2;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* Scene Base Class */
        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            animation: playTimeline 10s infinite;
        }

        /* Scene Timings (Total: 10s) */
        .scene-1 { animation-delay: 0s; }
        .scene-2 { animation-delay: 2.5s; }
        .scene-3 { animation-delay: 5s; }
        .scene-4 { animation-delay: 8s; }

        @keyframes playTimeline {
            0% { opacity: 0; transform: scale(1.05); }
            3% { opacity: 1; transform: scale(1); }
            22% { opacity: 1; transform: scale(1); }
            25% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 0; }
        }

        /* Scene 1 Styles */
        .scene-1 h1 {
            font-size: 3.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Scene 2 Styles */
        .scene-2 {
            align-items: flex-start;
            padding: 80px;
        }
        .scene-2 h2 {
            font-size: 2.5rem;
            margin-bottom: 30px;
        }
        .mockup-card {
            width: 700px;
            height: 380px;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            animation: slideIn 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }
        @keyframes slideIn {
            0% { transform: translateX(50px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        /* Scene 3 Styles */
        .scene-3 {
            flex-direction: row;
            justify-content: space-around;
            padding: 50px;
        }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .mini-card {
            width: 160px;
            height: 100px;
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .tech-sidebar {
            width: 220px;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .tech-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .dot {
            width: 10px;
            height: 10px;
            background: #38bdf8;
            border-radius: 50%;
        }

        /* Scene 4 Styles (Logo Reveal) */
        .scene-4 .logo-box {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #3b82f6 0%, #ec4899 100%);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
        }
        .scene-4 h1 {
            font-size: 2.8rem;
            letter-spacing: 1px;
        }
        .scene-4 p {
            color: #38bdf8;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="grid-background"></div>

    <div class="video-stage">
        <!-- Scene 1: Intro Title -->
        <div class="scene scene-1">
            <h1>Software Solutions Portfolio</h1>
        </div>

        <!-- Scene 2: Project Details Mockup -->
        <div class="scene scene-2">
            <h2>Project Details</h2>
            <div class="mockup-card"></div>
        </div>

        <!-- Scene 3: Multi-Projects & Tech Stack -->
        <div class="scene scene-3">
            <div class="project-grid">
                <div class="mini-card"></div>
                <div class="mini-card"></div>
                <div class="mini-card"></div>
                <div class="mini-card"></div>
                <div class="mini-card"></div>
                <div class="mini-card"></div>
            </div>
            <div class="tech-sidebar">
                <div class="tech-row"><div class="dot"></div> React / Next.js</div>
                <div class="tech-row"><div class="dot" style="background:#fbbf24;"></div> Python / AI</div>
                <div class="tech-row"><div class="dot" style="background:#a855f7;"></div> Cloud Infrastructure</div>
                <div class="tech-row"><div class="dot" style="background:#10b981;"></div> Automation Systems</div>
            </div>
        </div>

        <!-- Scene 4: Final Logo Reveal -->
        <div class="scene scene-4">
            <div class="logo-box">
                <div class="logo-icon">K</div>
                <h1>KANVO</h1>
            </div>
            <p>kanvosoftwaresolutions.github.io</p>
        </div>
    </div>

</body>
</html>
